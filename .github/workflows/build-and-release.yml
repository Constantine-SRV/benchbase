name: Build and Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Build command'
        required: true
        default: 'build-all'
        type: choice
        options:
          - build-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build MySQL profile
        run: |
          echo "=== Building MySQL profile ==="
          ./mvnw clean package -P mysql -DskipTests
          ls -lh target/benchbase-mysql.tgz
          cp target/benchbase-mysql.tgz ./benchbase-mysql.tgz

      - name: Build PostgreSQL profile
        run: |
          echo "=== Building PostgreSQL profile ==="
          ./mvnw clean package -P postgres -DskipTests
          ls -lh target/benchbase-postgres.tgz
          cp target/benchbase-postgres.tgz ./benchbase-postgres.tgz

      - name: Build OceanBase profile
        run: |
          echo "=== Building OceanBase profile ==="
          ./mvnw clean package -P oceanbase -DskipTests
          ls -lh target/benchbase-oceanbase.tgz
          cp target/benchbase-oceanbase.tgz ./benchbase-oceanbase.tgz

      - name: List artifacts
        run: |
          echo "=== Built artifacts ==="
          ls -lh *.tgz

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo ${{ secrets.GH_TOKEN }} | gh auth login --with-token

      - name: Delete existing release if exists
        run: |
          if gh release view latest_release; then
            gh release delete latest_release -y
          fi

      - name: Create Release
        run: |
          gh release create latest_release \
            ./benchbase-mysql.tgz \
            ./benchbase-postgres.tgz \
            ./benchbase-oceanbase.tgz \
            -t "Release latest_release"
